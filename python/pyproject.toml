[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qnca"
dynamic = ["version"]
description = "Quantile Necessary Condition Analysis (QNCA): a tolerance-parameterised generalisation of Dul's NCA."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Marek Deja", email = "marek.deja@uj.edu.pl" }]
keywords = ["necessary condition analysis", "NCA", "quantile", "soft computing", "isotonic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/MarekDejaUJ/qnca"
Documentation = "https://marekdejauj.github.io/qnca/"
Source = "https://github.com/MarekDejaUJ/qnca/tree/main/python"
Issues = "https://github.com/MarekDejaUJ/qnca/issues"

[tool.setuptools.dynamic]
version = { attr = "qnca.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
